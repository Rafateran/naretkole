<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin · Naretkole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="stars"></canvas>

<nav class="nav">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo" alt="Naretkolé Modas">
  </a>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Ver sitio</a>
    <a href="productos.html">Productos</a>
    <a href="admin.html" class="nav-cta accountLink active">Panel admin</a>
  </div>
  <button class="burger" id="burger" aria-label="Menú"><span></span><span></span><span></span></button>
</nav>

<section class="section container" style="padding-top:140px">
  <div class="admin-bar">
    <div class="section-head" style="text-align:left;margin:0">
      <span class="kicker">Administración</span>
      <h2 style="font-size:clamp(30px,4vw,48px)">Panel de control</h2>
    </div>
    <div>
      <button class="btn btn-oro" id="newBtn">＋ Nuevo producto</button>
      <button class="btn btn-ghost" id="logoutBtn" style="margin-left:8px">Salir</button>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="active" data-tab="productos">Productos</button>
    <button data-tab="pedidos">Pedidos</button>
  </div>

  <div class="tag-note">💾 Modo demo: los productos, fotos y pedidos se guardan en este navegador (localStorage). Al conectar un servidor real, estos datos se migrarán. Las fotos subidas se guardan comprimidas; usa imágenes de menos de ~1&nbsp;MB.</div>

  <div id="tabProductos"><div style="overflow-x:auto"><table class="admin-table" id="prodTable"></table></div></div>
  <div id="tabPedidos" style="display:none"></div>
</section>

<!-- MODAL producto -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Nuevo producto</h3>
    <form id="prodForm">
      <input type="hidden" name="id">
      <div class="form-row">
        <div class="field"><label>Nombre</label><input name="nombre" required placeholder="Ej. Traje Real Índigo"></div>
        <div class="field"><label>Precio ($)</label><input name="precio" type="number" min="0" step="1" required placeholder="285"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Categoría</label>
          <select name="categoria"><option value="trajes">Trajes</option><option value="quillas">Quillas y Coronas</option><option value="mazos">Mazos y Collares</option></select></div>
        <div class="field"><label>Orisha / etiqueta</label><input name="orisha" placeholder="Ej. Yemayá (opcional)"></div>
      </div>
      <div class="field full"><label>Descripción</label><textarea name="descripcion" placeholder="Describe la pieza…"></textarea></div>
      <div class="field full"><label>Foto del producto</label>
        <div class="img-drop">
          <input type="file" id="imgInput" accept="image/*" style="color:var(--hueso-suave)">
          <div id="imgPreviewWrap"><img id="imgPreview" style="display:none" alt=""></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:10px">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn-oro">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
  var CATN = NK.CATN;
  var table = document.getElementById('prodTable');
  var modalBg = document.getElementById('modalBg');
  var form = document.getElementById('prodForm');
  var imgInput = document.getElementById('imgInput');
  var imgPreview = document.getElementById('imgPreview');
  var currentImg = '';

  var _cache = [];
  function renderProducts(){
    return NK.getProducts().then(function(list){
      _cache = list || [];
      table.innerHTML =
        '<thead><tr><th>Foto</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'
        + _cache.map(function(p){
          return '<tr><td><img src="'+p.img+'" onerror="this.style.opacity=.2"></td>'
            + '<td>'+p.nombre+'</td>'
            + '<td><span class="badge-cat">'+(CATN[p.categoria]||p.categoria)+'</span></td>'
            + '<td>'+NK.money(p.precio)+'</td>'
            + '<td>'+(p.activo!==false?'Activo':'Oculto')+'</td>'
            + '<td><button class="mini" data-edit="'+p.id+'">Editar</button>'
            + '<button class="mini" data-toggle="'+p.id+'">'+(p.activo!==false?'Ocultar':'Mostrar')+'</button>'
            + '<button class="mini del" data-del="'+p.id+'">Borrar</button></td></tr>';
        }).join('') + '</tbody>';

      table.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ openModal(b.getAttribute('data-edit')); }; });
      table.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){
        if(confirm('¿Borrar este producto?')){ NK.deleteProduct(b.getAttribute('data-del')).then(renderProducts); } }; });
      table.querySelectorAll('[data-toggle]').forEach(function(b){ b.onclick=function(){
        var p = _cache.filter(function(x){ return String(x.id)===b.getAttribute('data-toggle'); })[0];
        NK.saveProduct(Object.assign({}, p, { activo: !(p.activo!==false) })).then(renderProducts); }; });
    });
  }

  function openModal(id){
    form.reset(); currentImg = ''; imgPreview.style.display='none';
    if(id){
      var p = _cache.filter(function(x){ return String(x.id)===String(id); })[0];
      document.getElementById('modalTitle').textContent = 'Editar producto';
      form.id.value = p.id; form.nombre.value = p.nombre; form.precio.value = p.precio;
      form.categoria.value = p.categoria; form.orisha.value = p.orisha||''; form.descripcion.value = p.descripcion||'';
      currentImg = p.img || '';
      if(currentImg){ imgPreview.src = currentImg; imgPreview.style.display='block'; }
    } else {
      document.getElementById('modalTitle').textContent = 'Nuevo producto';
      form.id.value = '';
    }
    modalBg.classList.add('show');
  }
  function closeModal(){ modalBg.classList.remove('show'); }

  imgInput.addEventListener('change', function(){
    var f = imgInput.files[0]; if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      // Redimensiona para no llenar el almacenamiento
      var img = new Image();
      img.onload = function(){
        var max = 900, sc = Math.min(1, max/img.width);
        var c = document.createElement('canvas');
        c.width = img.width*sc; c.height = img.height*sc;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        currentImg = c.toDataURL('image/jpeg', 0.82);
        imgPreview.src = currentImg; imgPreview.style.display='block';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var saveBtn = form.querySelector('button[type=submit]'); saveBtn.disabled = true; saveBtn.textContent = 'Guardando…';
    var p = {
      id: form.id.value || undefined,
      nombre: form.nombre.value.trim(),
      precio: parseFloat(form.precio.value)||0,
      categoria: form.categoria.value,
      orisha: form.orisha.value.trim(),
      descripcion: form.descripcion.value.trim()
    };
    // Sube la foto solo si es nueva (dataURL). Si no, conserva la actual.
    var imgStep = (currentImg && currentImg.indexOf('data:')===0)
      ? NK.uploadImage(currentImg)
      : Promise.resolve(currentImg || 'assets/strip-bg.svg');
    imgStep.then(function(url){
      p.img = url;
      return NK.saveProduct(p);
    }).then(function(){
      saveBtn.disabled = false; saveBtn.textContent = 'Guardar';
      closeModal(); renderProducts();
    }).catch(function(err){
      console.warn(err); saveBtn.disabled = false; saveBtn.textContent = 'Guardar';
      alert('No se pudo guardar. Revisa tu conexión / permisos.');
    });
  });

  document.getElementById('newBtn').onclick = function(){ openModal(); };
  document.getElementById('cancelBtn').onclick = closeModal;
  modalBg.addEventListener('click', function(e){ if(e.target===modalBg) closeModal(); });
  document.getElementById('logoutBtn').onclick = function(){ NK.logout(); window.location.href='index.html'; };

  // Tabs
  document.querySelectorAll('.admin-tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.admin-tabs button').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      var t = b.getAttribute('data-tab');
      document.getElementById('tabProductos').style.display = t==='productos'?'':'none';
      document.getElementById('tabPedidos').style.display = t==='pedidos'?'':'none';
      if(t==='pedidos') renderOrders();
    });
  });

  function renderOrders(){
    var el = document.getElementById('tabPedidos');
    el.innerHTML = '<div class="empty-cat"><p>Cargando…</p></div>';
    NK.getOrders().then(function(orders){
      orders = orders || [];
      if(!orders.length){ el.innerHTML = '<div class="empty-cat"><div class="ico">✦</div><p>Aún no hay pedidos.</p></div>'; return; }
      el.innerHTML = orders.map(function(o){
        var env = o.envio || {};
        var items = (o.items||[]).map(function(it){ return it.qty+'× '+it.nombre; }).join(' · ');
        return '<div class="order-card"><div class="oh"><span class="oid">'+o.id+'</span>'
          + '<span class="estado">'+String(o.estado||'').replace(/_/g,' ')+'</span></div>'
          + '<div class="oitems">'+items+'</div>'
          + '<div class="ot">Total: <b style="color:var(--oro-claro)">'+NK.money(o.total)+'</b></div>'
          + '<div style="margin-top:8px;color:var(--hueso-suave);font-size:13px">'
          + (env.nombre?('👤 '+env.nombre+' · '):'')+(o.email||'')
          + (env.tel?(' · ☎ '+env.tel):'')
          + (env.dir?(' · 📍 '+env.dir+', '+(env.ciudad||'')):'')+'</div></div>';
      }).join('');
    });
  }

  NK.init().then(function(){
    if(!NK.isAdmin()){ window.location.href = 'login.html'; return; }
    renderProducts();
  });
})();
</script>
</body>
</html>
